name: Cargo Build & Test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: router-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Router full build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned Linux amd64 native toolchain
        run: docker build -t adapter-validation -f ci/Dockerfile .
      - name: Build every target and test router, adapters, admission and inference
        run: |
          docker run --rm -v "$PWD:/work" -w /work adapter-validation bash -euc '
            npm ci --prefix lib/dex-meteora-dbc/worker --ignore-scripts --omit=dev --no-audit --no-fund
            cargo build --locked --workspace --all-targets
            cargo test --locked -p autobahn-router --bin autobahn-router
            cargo test --locked -p dex-meteora-dbc -p dex-stake-pool --lib
            node --test lib/dex-meteora-dbc/worker/test/*.test.mjs
            node --test tools/inference/test/*.test.mjs
            python3 -m unittest discover -s ci -p "test_*.py"
            python3 -m unittest discover -s tools/registry -p "test_*.py"
          '
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Adapter scope cannot modify the executor or this policy checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned native validation toolchain
        run: docker build -t adapter-validation -f ci/Dockerfile .
      - name: Build real SBF executor and test venue from trusted source
        run: docker build -t adapter-sbf -f ci/sbf.Dockerfile .
      - name: Compile independent executor integration runner
        run: docker build -t adapter-executor -f ci/executor.Dockerfile .
      - name: Require actual SBF hop, slippage and fee tests
        run: >-
          docker run --rm --network none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --pids-limit=1024 --memory=6g --cpus=4
          --tmpfs /tmp:rw,nosuid,size=1g adapter-executor
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject fixable critical dependency advisories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
