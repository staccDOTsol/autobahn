# RPC_HTTP_URL is a server secret. No wallet or signing key is required.
[rpc_routing]
refresh_seconds = 10
max_hops = 12
max_paths = 256

# Warm examples, never an allowlist. Unknown requested mints are discovered.
[adapters.meteora-dbc]
base_mints = "HHWMBr8ff51WYFUwsFMFndFCj8EzMrv5c3Bi44xuchZC,53cTDPa69sUXtn4FiuXiKEipJGkUUaNxoisBiuSFkd5i"

[routing]
path_cache_validity_ms = 500
lookup_tables = []
[server]
address = "0.0.0.0:8080"
[metrics]
output_stdout = false
output_http = false
[price_feed]
birdeye_token = "unused"
refresh_interval_secs = 60

[[sources]]
rpc_http_url = "$RPC_HTTP_URL"
rpc_support_compression = false
dedup_queue_size = 1000
request_timeout_in_seconds = 10
number_of_accounts_per_gma = 100

