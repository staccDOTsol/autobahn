name: Deploy admitted router
on:
  workflow_dispatch:
    inputs:
      sha: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: aggregator-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact commit on the protected default branch
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["DEPLOY_SHA"])'
          git merge-base --is-ancestor "$DEPLOY_SHA" "origin/$DEFAULT_BRANCH"
          git checkout --detach "$DEPLOY_SHA"
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy tested source
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN"
          flyctl deploy --remote-only --config deploy/fly.toml --strategy rolling
